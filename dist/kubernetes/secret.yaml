apiVersion: v1
kind: Secret
metadata:
  name: identityserver-secret
  namespace: default   # change to your namespace
type: Opaque
# Values must be base64-encoded.
# Encode on Linux/macOS:  echo -n 'value' | base64
# Encode on Windows:      [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('value'))
stringData:
  # ── Signing credential ──────────────────────────────────────────────────────
  # Password for the auto-generated signing certificate. Change before deploying!
  IDENTITYSERVER__SIGNINGCREDENTIAL__CERTPASSWORD: "Change-This-Password!"

  # ── Seeding (Migrations) ────────────────────────────────────────────────────
  # Password for the admin account created on first start.
  IDENTITYSERVER__MIGRATIONS__ADMINPASSWORD: "Admin1234!"

  # ── Database (uncomment the one you use) ────────────────────────────────────
  # IDENTITYSERVER__CONNECTIONSTRINGS__SQLSERVER: "Server=db;Database=IdentityServerNET;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
  # IDENTITYSERVER__CONNECTIONSTRINGS__POSTGRES: "Host=db;Database=identityservernet;Username=postgres;Password=yourpassword"
  # IDENTITYSERVER__CONNECTIONSTRINGS__MONGODB: "mongodb://mongo:27017"

  # ── Mail (uncomment and fill in the sender you use) ─────────────────────────
  # IDENTITYSERVER__MAIL__SMTP__PASSWORD: "smtp-password"
  # IDENTITYSERVER__MAIL__SENDGRID__APIKEY: "SG.xxxxxxxxxxxx"
  # IDENTITYSERVER__MAIL__MAILJET__SECRETKEY: "your-mailjet-secret"

  # ── External identity providers ─────────────────────────────────────────────
  # IDENTITYSERVER__EXTERNAL__MICROSOFTIDENTITYWEB__CLIENTSECRET: "your-aad-client-secret"
